        caption: 2022.04 ~ 2022.06
        link: https://play.google.com/store/apps/details?id=com.dungsil.together&pli=1
        quote: >
          서울시 열린데이터광장 웹·앱 경진대회 / Google Play 배포
        description: |
          서울시 결식 아동의 급식카드 사용 불편을 줄이기 위해 금액 조회, 내 위치 주변 급식카드 가맹점 조회,
          선한영향력 가게 조회, 챗봇 기능을 담은 앱을 개발하고 실제 배포했습니다.

          #### 주요 역할
          * 오픈 API 효율적 이용을 위한 열린 데이터 전처리
          * MongoDB 공간쿼리를 활용한 주변 가맹점 조회 기능 개발
          * 카테고리별 검색 및 점포명 검색 기능 개발
          * Selenium을 통한 카드 잔액 및 거래내역 조회 기능 개발

          #### 문제 해결 경험
          * 사용자 위치 기반 주변 가맹점 조회의 완전탐색 성능 문제를 MongoDB 공간쿼리로 개선하여 성능 25% 향상
          * 금융 API를 통한 잔액 조회 한계를 웹 자동화 방식으로 해결

          #### 사용 기술
          Java, Python, Spring Boot, AWS EC2, AWS Lambda, MongoDB, REST API, JUnit5, Kakao Map Open API

