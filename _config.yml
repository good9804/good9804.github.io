about_content: |
  안녕하세요. Software Engineer / Back-end Developer 이건희입니다.

  한화시스템에서 C++ 기반 메시지 기능 개발과 체계 간 연동 시험을 수행하며,
  실시간 메시지 모니터링과 로그 기반 통신 이상 분석 경험을 쌓았습니다.
  디지털 트윈 데이터 연동, 위치 기반 서비스, 웹 백엔드 개발 경험을 바탕으로
  데이터 흐름을 이해하고 유지보수하기 쉬운 소프트웨어를 개발합니다.

