  - title: Work Experience
    layout: list
    content:
      - layout: left
        title: 한화시스템
        sub_title: Software Engineer
        caption: 2023 ~ 재직중
        quote: >
          Link-22 함정/육상 체계개발
        description: |
          Link-22 함정/육상 체계개발 사업에서 C++ 기반 메시지 기능 개발과 운용/개발시험을 수행했습니다.
          실환경 연동 시험에서 체계 간 데이터 송수신 상태를 검증하고, 통신 이상 현상을 로그 기반으로 분석했습니다.

          #### 주요 역할
          * C++ 기반 담당 6종 메시지 기능 개발 및 운용/개발시험 수행
          * HF/UHF 무선 연동 시험에서 표적 정보 및 PLI 송수신 검증
          * 패킷, 시리얼, 네트워크 로그 기반 통신 이상 현상 분석
          * 함정/육상 체계 시험 데이터 분석을 위한 다중 컴포넌트 로그뷰어 및 조건 검색 기능 개발

          #### 사용 기술
          C++, Qt, Linux, Network, Serial/Packet Log Analysis

      - layout: left
        title: 한화시스템
        sub_title: Software Engineer
        caption: 2023 ~ 재직중
        quote: >
          무인기 GCS 실시간 메시지 모니터
        description: |
          무인기와 GCS 간 송수신 메시지를 실시간으로 확인하기 위한 패킷 기반 메시지 파싱 모니터를 개발했습니다.
          광범위한 메시지 필드와 필드값을 JSON으로 구조화하여 모니터링과 로그 분석에 활용할 수 있도록 구현했습니다.

          #### 주요 역할
          * 무인기-GCS 간 송수신 패킷 실시간 파싱 및 메시지 모니터링 기능 구현
          * 메시지 로그 저장, 로그 불러오기 및 재분석 기능 구현
          * 메시지별 필드와 필드값을 JSON 구조로 자동 변환하는 기능 개발
          * 하드코딩 파싱 방식에서 JSON 기반 동적 파싱 구조로 개선하여 유지보수성과 확장성 향상

          #### 사용 기술
          C++, JSON, Packet Parsing, Real-time Monitoring, Log Analysis

      - layout: left
        title: 에스프레소 미디어
        sub_title: Back-end Engineer
        caption: 2023.06 ~ 2023.09
        link: https://github.com/good9804/APC
        quote: >
          교내 현장실습 인턴십
        description: |
          농림축산식품부 인공지능 기반 신선과채류 품질 판정 기술 개발 사업에서 디지털 트윈 통합 시스템 개발에 참여했습니다.
          입고, 저장, 품질 판정, 출하 과정의 운영 데이터를 웹 서비스와 Unity 3D 환경에 연동했습니다.

          #### 주요 역할
          * 입출고량 통계 페이지 개발을 통한 생산/물류 데이터 시각화
          * Firebase와 Node.js 기반 웹 서버와 Unity 3D 모델링 데이터베이스 실시간 연동 구현
          * 입고 공정 대기 페이지 추가로 공정 단계 세분화 및 관리 편의성 개선
          * 출하 과정에서 품질 선별 결과와 생산자 정보를 담은 RFID 연동 기능 구현
          * nginx 기반 모듈 독립화를 통해 시스템 확장성과 유지보수성 개선

          #### 사용 기술
          JavaScript, Vue, Node.js, Firebase, Jenkins, nginx, Kafka, MongoDB

