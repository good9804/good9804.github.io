  - title: Projects # Title for the section
    layout: list # Type of content section (list/text)
    content:
      - layout: left
        title: 사용자 위치기반 셔틀버스 플랫폼 서비스 
        sub_title: 담당 - Django Back-end
        caption: 2021.12 ~ 2022.06
        link: https://github.com/good9804/DoriDori
        # link_text: Project Website
        # additional_links:
        #   - title: GooglePlay
        #     icon: fab fa-google-play
        #     url: https://play.google.com/store/apps/details?id=com.sigmai.stylemento
        #   - title:  Github page for project (eg. sproogen/modern-resume-theme)
        #     icon: fab fa-github
        #     url: Link to project (eg. sproogen.github.io/modern-resume-theme)
        quote: >
          교내 산학연계 SW프로젝트+캡스톤 프로젝트
        description: | # this will include new lines to allow paragraphs
          #### [설명]
          * 출발지,도착지의 행정구역이 같은 사용자끼리 클러스터링하여 버스 노선을 생성하여 운영하는 셔틀버스 플랫폼을 개발하였습니다.

          #### [역할]
          * 사용자의 위치 데이터 클러스터링 기능 구현-> k-means 클러스터링의 약점을 보완한 k-means++로 진행하여 약 30% 성능 향상
          * sqlite을 이용한 관계형 데이터베이스 설계
          * 다익스트라 알고리즘을 이용한 경유지 최적화 알고리즘 구현
          * 티맵 오픈api를 이용하여 클러스터링 결과와 가장 가까운 정류장으로 매핑시켜 데이터베이스에 저장 및 노선 생성 기능 구현
          * ORM을 사용한  DB 쿼리문 담당 

          #### [문제 해결 경험]
          * 실 사용자들의 데이터 분포가 다르기때문에 어떻게하면 최적의 정류장 개수를 찾을지 고민하였습니다. 
            전공 수업중 배웠던 클러스터링 지표 실루엣 스코어와 엘보우 메소드를 이용하여 최적의 정류장 개수를 찾아 해결하였습니다.
          
          

          #### [사용 기술]
          * 언어 : Python
          * 프레임워크 : Django,
          * DB : sqlite
          * API: REST API
          * 외부 API : 티맵 오픈 API, 카카오맵 오픈 API

      - layout: left
        title: 서울시 결식 아동을 위한 간편 어플- 어깨동무
        sub_title: 담당 - Spring Boot 백엔드
        caption: 2022.04 ~ 2022.06
        link: https://play.google.com/store/apps/details?id=com.dungsil.together&pli=1
        # additional_links:
        #   - title: swoomi
        #     icon: fas fa-globe
        #     url: https://swoomi.me
        quote: >
          서울시 열린데이터광장 웹/앱 경진대회 참여
        description: | # this will include new lines to allow paragraphs
          #### [설명]
          * 서울시 결식 아동의 급식 카드 불편함을 줄이고자 간편한 금액 조회, 내 위치 주변 급식카드 가맹점 조회, 
          선한영향력 가게 조회,챗봇 기능을 담은 어플을 개발하였습니다. 실제 배포까지 진행하였습니다

          #### [인원]
          * 4명 - 백엔드 2명, 프론트 1명, 기획&디자이너 1명

          #### [역할]
          * 오픈 api 효율적인 이용을 위해 열린 데이터 전처리
          * MongoDB 공간쿼리를 활용한 주변 가맹점 조회 기능 개발
          * 카테고리별 검색 기능,점포명 검색 기능 개발
          * 셀레니움을 통한 카드 잔액,거래 내역 조회 기능 개발

          #### [문제 해결 경험]
          * 사용자의 위치를 기반으로 주변 가맹점 조회할 때 완전탐색으로 진행하면 시간이 오래 걸려 고민을 하였습니다.
            MongoDB의 공간쿼리 기능을 활용하여 성능을 25% 향상 시켰습니다.
          * 금융 api를 통해 잔액을 조회하는 것이 쉽지않았습니다. 
          사용자의 카드 정보 입력을 받아 웹 자동화 도구를 통해 잔액,거래내역 조회 기능 구현에 성공하였습니다.

          #### [사용 기술]
          * 언어 : Java,Python
          * 프레임워크 : Spring Boot,
          * 서버 : AWS EC2, Lambda
          * DB : MongoDB
          * API: REST API, 
          * Test: JUnit5
          * 외부 API : 카카오맵 오픈 API

