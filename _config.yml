        description: |
          출발지와 도착지의 행정구역이 같은 사용자끼리 클러스터링하여 셔틀버스 노선을 생성하고 운영하는 플랫폼을 개발했습니다.
          위치 데이터 기반 경로탐색과 노선 최적화에 중점을 두었습니다.

          #### 주요 역할
          * 사용자 위치 데이터 기반 정류장 군집화 기능 구현
          * 다익스트라 알고리즘을 이용한 경유지 최적화 알고리즘 구현
          * T-map Open API를 활용해 클러스터링 결과와 가까운 정류장을 매핑하고 DB 저장
          * SQLite 기반 관계형 데이터베이스 설계 및 ORM 기반 DB 쿼리 처리

          #### 문제 해결 경험
          * 노선별 최적 정류장 개수 결정 문제를 실루엣 스코어와 엘보우 메소드로 해결
          * k-means의 무작위 초기화로 인한 수렴 지연을 k-means++로 개선하여 성능 18% 향상

          #### 사용 기술
          Python, Django, SQLite, REST API, T-map Open API, Kakao Map Open API

